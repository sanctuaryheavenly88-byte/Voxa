<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXA — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06060d;
    --bg-2: #0a0a16;
    --blue: #4a7fe8;
    --purple: #7a4be8;
    --teal: #52e0c4;
    --gold: #f2c94c;
    --text: #f2f2f8;
    --muted: #8d8da6;
    --line: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  #stage{
    position:relative; width:100vw; height:100vh;
    overflow:hidden;
  }

  /* ===================== INTRO / ENTRANCE ===================== */
  #intro{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 900px 700px at 20% 20%, rgba(74,127,232,0.16), transparent 60%),
      radial-gradient(ellipse 900px 700px at 80% 85%, rgba(122,75,232,0.18), transparent 60%),
      var(--bg);
    cursor:pointer;
    overflow:hidden;
  }
    55%{ opacity:1; }
    100%{ opacity:1; transform:scale(1.02); filter:saturate(1.1) brightness(0.9) blur(0px);}
  }

  #intro .stars{
    position:absolute; inset:0;
    pointer-events:none;
  }
  #intro .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:0;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; }
    50%{ opacity:0.9; }
  }
  #intro .vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, rgba(122,75,232,0.10) 0%, transparent 55%);
    pointer-events:none;
  }
    100%{ opacity:1; }
  }
  #intro .prompt{
    position:relative; z-index:3;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    opacity:0;
    animation: promptIn 1.1s ease-out 1.1s forwards;
  }
  @keyframes promptIn{
    0%{ opacity:0; transform:translateY(10px);}
    100%{ opacity:1; transform:translateY(0);}
  }
  #intro .prompt .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px; letter-spacing:0.32em; text-transform:uppercase;
    color: var(--teal);
  }
  #intro .prompt .title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:15px;
    color: var(--text);
  }
  #intro .prompt .intro-logo{
    width:56px; height:56px;
    filter: drop-shadow(0 0 14px rgba(122,75,232,0.55));
    animation: introLogoPulse 2.4s ease-in-out infinite;
  }
  @keyframes introLogoPulse{
    0%,100%{ transform:scale(1); filter:drop-shadow(0 0 14px rgba(122,75,232,0.55)); }
    50%{ transform:scale(1.08); filter:drop-shadow(0 0 22px rgba(82,224,196,0.7)); }
  }
  #intro.hide{
    animation: introOut 0.9s ease-in forwards;
    pointer-events:none;
  }
  @keyframes introOut{
    0%{ opacity:1; }
    100%{ opacity:0; }
  }

  /* ===================== WARP / ЧИСТЫЙ КОСМИЧЕСКИЙ ПРИБЛИЖЕНИЕ ===================== */
  #warp{
    position:absolute; inset:0;
    width:100%; height:100%;
    background:#000;
    display:none;
    z-index:4;
    overflow:hidden;
  }
  #warp canvas{
    position:absolute; inset:0;
    display:block;
    width:100%; height:100%;
  }

  /* ===================== REVEAL / LOGO ===================== */
  #reveal{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 40%, #0d0d1e 0%, #06060d 70%);
    opacity:0; pointer-events:none;
  }
  #reveal.show{
    opacity:1; pointer-events:auto;
    animation: revealFade 0.6s ease-out forwards;
  }
  @keyframes revealFade{
    0%{ opacity:0; } 100%{ opacity:1; }
  }
  #reveal .sparks{
    position:absolute; inset:0; pointer-events:none;
  }
  #reveal .spark{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; opacity:0;
  }
  #reveal .logo-wrap{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:26px;
  }
  #reveal .glow{
    position:absolute; width:340px; height:340px; border-radius:50%;
    background: radial-gradient(circle, rgba(122,75,232,0.35) 0%, rgba(74,127,232,0.18) 45%, transparent 72%);
    top:50%; left:50%; transform:translate(-50%,-58%);
    filter: blur(6px);
    opacity:0;
  }
  #reveal.show .glow{
    animation: glowIn 1.6s ease-out 0.15s forwards;
  }
  @keyframes glowIn{
    0%{ opacity:0; transform:translate(-50%,-58%) scale(0.6);}
    100%{ opacity:1; transform:translate(-50%,-58%) scale(1);}
  }
  #reveal img.logo{
    width:132px; height:132px;
    opacity:0; transform:scale(0.4) translateY(18px);
    filter: drop-shadow(0 0 26px rgba(122,75,232,0.55));
  }
  #reveal.show img.logo{
    animation: logoPop 1s cubic-bezier(.2,.9,.25,1.2) 0.25s forwards;
  }
  @keyframes logoPop{
    0%{ opacity:0; transform:scale(0.3) translateY(24px) rotate(-8deg);}
    60%{ opacity:1; transform:scale(1.08) translateY(-4px) rotate(2deg);}
    100%{ opacity:1; transform:scale(1) translateY(0) rotate(0deg);}
  }
  #reveal .wordmark{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700; font-size:34px; letter-spacing:0.06em;
    background: linear-gradient(90deg, var(--text) 0%, var(--text) 55%, var(--teal) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    opacity:0; transform:translateY(10px);
  }
  #reveal.show .wordmark{
    animation: wmIn 0.8s ease-out 0.85s forwards;
  }
  @keyframes wmIn{
    0%{ opacity:0; transform:translateY(10px); letter-spacing:0.16em;}
    100%{ opacity:1; transform:translateY(0); letter-spacing:0.06em;}
  }
  #reveal .tagline{
    font-family:'Inter', sans-serif;
    font-size:13.5px; color:var(--muted);
    letter-spacing:0.01em;
    opacity:0; transform:translateY(8px);
  }
  #reveal.show .tagline{
    animation: tgIn 0.8s ease-out 1.15s forwards;
  }
  @keyframes tgIn{
    0%{ opacity:0; transform:translateY(8px);} 100%{ opacity:1; transform:translateY(0);}
  }

  /* ===================== IDEA SECTION ===================== */
  #idea{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:32px;
    opacity:0; pointer-events:none;
    background:
      radial-gradient(ellipse 700px 500px at 18% 15%, rgba(74,127,232,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 90%, rgba(122,75,232,0.14), transparent 60%),
      var(--bg);
  }
  #idea.show{
    opacity:1; pointer-events:auto;
    animation: ideaIn 0.9s ease-out forwards;
  }
  @keyframes ideaIn{
    0%{ opacity:0; transform:translateY(18px);}
    100%{ opacity:1; transform:translateY(0);}
  }
  #idea .card{
    width:100%; max-width:560px;
    display:flex; flex-direction:column; gap:22px;
  }
  #idea .brand-mini{
    display:flex; align-items:center; gap:10px;
  }
  #idea .brand-mini img{ width:28px; height:28px; }
  #idea .brand-mini span{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:14px; letter-spacing:0.1em; color:var(--muted);
  }
  #idea .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size:11px; letter-spacing:0.3em; text-transform:uppercase;
    color:var(--teal);
  }
  #idea h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:clamp(26px,4vw,38px); line-height:1.15;
    color:var(--text);
  }
  #idea h1 em{
    font-style:normal;
    background:linear-gradient(90deg, var(--blue), var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #idea p.sub{
    font-size:14.5px; color:var(--muted); line-height:1.55; max-width:460px;
  }
  #idea textarea{
    width:100%; min-height:120px;
    background: rgba(255,255,255,0.03);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    color:var(--text);
    font-family:'Inter', sans-serif; font-size:14.5px; line-height:1.5;
    resize:vertical;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  #idea textarea::placeholder{ color:#5c5c72; }
  #idea textarea:focus{
    outline:none;
    border-color: rgba(122,75,232,0.55);
    background: rgba(255,255,255,0.045);
  }
  #idea .row{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  #idea .tags{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  #idea .tag{
    font-size:12px; color:var(--muted);
    border:1px solid var(--line); border-radius:100px;
    padding:6px 12px; cursor:pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
    font-family:'Inter', sans-serif;
    background:transparent;
  }
  #idea .tag:hover{ border-color: rgba(82,224,196,0.5); color:var(--text); }
  #idea button.submit{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:14px;
    color:#0a0a12;
    background: linear-gradient(90deg, var(--teal), var(--blue));
    border:none; border-radius:12px;
    padding:14px 26px;
    cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px -8px rgba(74,127,232,0.55);
  }
  #idea button.submit:hover{ transform:translateY(-2px); box-shadow: 0 12px 28px -8px rgba(122,75,232,0.6); }
  #idea button.submit:active{ transform:translateY(0); }
  #idea .status{
    font-size:12.5px; color:var(--muted); min-height:16px;
  }

  .skip{
    position:absolute; bottom:24px; right:28px; z-index:5;
    font-family:'Inter', sans-serif; font-size:12px; color:var(--muted);
    background:transparent; border:1px solid var(--line); border-radius:100px;
    padding:8px 14px; cursor:pointer; letter-spacing:0.02em;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .skip:hover{ color:var(--text); border-color:rgba(255,255,255,0.25); }

  @media (max-width: 560px){
    #reveal img.logo{ width:104px; height:104px; }
    #reveal .wordmark{ font-size:26px; }
    #idea .card{ gap:18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

    <div class="prompt">

    <canvas id="warpCanvas"></canvas>

      <textarea id="ideaInput" placeholder="Например: пиксельный подземный храм с фиолетовым туманом и светящимися рунами..."></textarea>

<script>
  const intro = document.getElementById('intro');
  const reveal = document.getElementById('reveal');
  const idea = document.getElementById('idea');
  const skipBtn = document.getElementById('skipBtn');
  const sparksEl = document.getElementById('sparks');
  let pendingTimeouts = [];

  // логотип на экране входа — тот же файл, что и в reveal, без дублирования base64
  document.getElementById('introLogo').src = document.querySelector('#reveal img.logo').src;

  let started = false;

  function spawnSparks(){
    sparksEl.innerHTML = '';
    for(let i=0;i<26;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = Math.random()*Math.PI*2;
      const dist = 60 + Math.random()*160;
      const x = Math.cos(angle)*dist;
      const y = Math.sin(angle)*dist;
      s.style.left = '50%';
      s.style.top = '46%';
      s.style.setProperty('--x', x+'px');
      s.style.setProperty('--y', y+'px');
      const delay = Math.random()*0.5;
      const dur = 0.9 + Math.random()*0.8;
      s.style.background = Math.random() > 0.6 ? '#f2c94c' : '#fff';
      s.animate([
        { transform:'translate(0,0) scale(0)', opacity:0 },
        { transform:`translate(${x*0.4}px, ${y*0.4}px) scale(1)`, opacity:1, offset:0.35 },
        { transform:`translate(${x}px, ${y}px) scale(0)`, opacity:0 }
      ], { duration: dur*1000, delay: delay*1000, easing:'ease-out', fill:'forwards' });
      sparksEl.appendChild(s);
    }
  }

  /* =========================================================
     Анимация приближения — только звёзды на весь экран,
     плавное ускорение: медленно -> быстро
     ========================================================= */
  const warpEl = document.getElementById('warp');
  const warpCanvas = document.getElementById('warpCanvas');
  const wctx = warpCanvas.getContext('2d');

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let WW, WH, WCX, WCY, warpFocal, warpBgGradient;

  function warpResize(){
    // берём реальные размеры контейнера — canvas гарантированно
    // растягивается на весь экран (и на телефоне, и на ноутбуке)
    WW = warpEl.clientWidth || window.innerWidth;
    WH = warpEl.clientHeight || window.innerHeight;
    warpCanvas.width = WW * dpr;
    warpCanvas.height = WH * dpr;
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    WCX = WW/2; WCY = WH/2;
    warpFocal = Math.min(WW, WH) * 0.62;

    warpBgGradient = wctx.createRadialGradient(
      WCX, WH*0.42, 0,
      WCX, WH*0.42, Math.max(WW, WH)*0.85
    );
    warpBgGradient.addColorStop(0,   'rgba(38,28,70,1)');
    warpBgGradient.addColorStop(0.35,'rgba(18,17,42,1)');
    warpBgGradient.addColorStop(1,   'rgba(6,6,13,1)');
  }
  window.addEventListener('resize', warpResize);
  warpResize();

  const WARP_STAR_COUNT = Math.min(window.innerWidth, window.innerHeight) < 600 ? 260 : 420;
  const WARP_DEPTH = Math.max(WW, WH) * 1.3;
  let warpStars = [];
  function initWarpStars(){
    warpStars = [];
    for(let i=0;i<WARP_STAR_COUNT;i++){
      warpStars.push({
        x:(Math.random()-0.5)*WARP_DEPTH*1.6,
        y:(Math.random()-0.5)*WARP_DEPTH*1.6,
        z:Math.random()*WARP_DEPTH
      });
    }
  }
  initWarpStars();

  function easeInQuint(t){ return t*t*t*t*t; }

  const WARP_ACCEL_MS = 7000; // весь путь: от медленного до быстрого за 7 секунд
  const WARP_TOTAL_MS = WARP_ACCEL_MS;
  const WARP_BASE_SPEED = 14;
  const WARP_MAX_SPEED = 19200;

  let warpRAF = null;

  function playWarpSequence(onDone){
    warpEl.style.display = 'block';
    warpResize();
    initWarpStars();

    if(warpRAF) cancelAnimationFrame(warpRAF);
    const start = performance.now();
    let last = start;

    function frame(now){
      const dt = Math.min(64, now - last);
      last = now;
      const elapsed = now - start;

      // непрерывное плавное ускорение на всём 5-секундном отрезке —
      // от почти незаметного дрейфа до уверенного быстрого полёта
      const t = Math.min(1, elapsed / WARP_ACCEL_MS);
      const speedFactor = easeInQuint(t);
      const speed = (WARP_BASE_SPEED + speedFactor * (WARP_MAX_SPEED - WARP_BASE_SPEED)) * (dt/1000);

      wctx.fillStyle = warpBgGradient;
      wctx.fillRect(0, 0, WW, WH);

      for(const s of warpStars){
        const prevZ = s.z;
        s.z -= speed;
        if(s.z <= 1){
          s.x = (Math.random()-0.5)*WARP_DEPTH*1.6;
          s.y = (Math.random()-0.5)*WARP_DEPTH*1.6;
          s.z = WARP_DEPTH;
        }
        const k = warpFocal / s.z;
        const x = s.x * k + WCX;
        const y = s.y * k + WCY;
        if(x < -20 || x > WW+20 || y < -20 || y > WH+20) continue;

        const pk = warpFocal / prevZ;
        const px = s.x * pk + WCX;
        const py = s.y * pk + WCY;

        const depthF = 1 - s.z/WARP_DEPTH;
        const alpha = Math.min(1, depthF*1.4 + 0.15);

        wctx.strokeStyle = `rgba(215,225,255,${alpha})`;
        wctx.lineWidth = depthF*2.4 + 0.4;
        wctx.beginPath();
        wctx.moveTo(px, py);
        wctx.lineTo(x, y);
        wctx.stroke();
      }

      if(elapsed < WARP_ACCEL_MS){
        warpRAF = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(warpRAF);
        warpEl.style.display = 'none';
        onDone && onDone();
      }
    }

    warpRAF = requestAnimationFrame(frame);
  }

  function goToReveal(){
    if(started) return;
    started = true;
    intro.classList.add('hide');
    const t1 = setTimeout(()=>{
      intro.style.display = 'none';
      playWarpSequence(()=>{
        reveal.classList.add('show');
        skipBtn.style.display = 'none';
        spawnSparks();
      });
    }, 480);
    const t2 = setTimeout(()=>{ goToIdea(); }, 480 + WARP_TOTAL_MS + 3300);
    pendingTimeouts.push(t1, t2);
  }

  function goToIdea(){
    reveal.style.transition = 'opacity 0.6s ease';
    reveal.style.opacity = '0';
    setTimeout(()=>{
      reveal.style.display = 'none';
      idea.classList.add('show');
    }, 550);
  }

  // Пропустить: доступно только до появления основного лого VOXA.
  // Мгновенно обрывает интро/анимацию полёта и сразу показывает лого,
  // дальше всё идёт как обычно (лого -> форма ввода).
  function skipToReveal(){
    pendingTimeouts.forEach(id => clearTimeout(id));
    pendingTimeouts = [];
    if(warpRAF){ cancelAnimationFrame(warpRAF); warpRAF = null; }

    started = true;
    intro.style.display = 'none';
    warpEl.style.display = 'none';

    if(!reveal.classList.contains('show')){
      reveal.classList.add('show');
      spawnSparks();
    }
    skipBtn.style.display = 'none';

    const t = setTimeout(()=>{ goToIdea(); }, 3300);
    pendingTimeouts.push(t);
  }

  intro.addEventListener('click', goToReveal);
  skipBtn.addEventListener('click', skipToReveal);

  // auto-start the entrance shortly after load
  setTimeout(()=>{ if(!started) goToReveal(); }, 1600);

  document.querySelectorAll('.tag').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('ideaInput').value = btn.dataset.t;
      document.getElementById('ideaInput').focus();
    });
  });

  document.getElementById('genBtn').addEventListener('click', ()=>{
    const val = document.getElementById('ideaInput').value.trim();
    const status = document.getElementById('status');
    if(!val){
      status.textContent = 'Сначала опишите идею.';
      status.style.color = '#e07a7a';
      return;
    }
    status.style.color = '#8d8da6';
    status.textContent = 'Генерируем ассеты…';
    setTimeout(()=>{
      status.textContent = 'Готово — ассеты добавлены в проект.';
    }, 1400);
  });
</script>
</body>
</html>
